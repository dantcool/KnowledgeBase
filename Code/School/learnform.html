<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Form</title>

</head>
<body>
    <h1>Learn Form</h1>
    <form action="/login" method="post">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required ><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for=""feedback">Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="4" cols="50"></textarea><br><br>

        <label for="major">Select your Major:</label>
        <select id="major" name="major">
            <option value="computer-science">Computer Science</option>
            <option value="mathematics">Mathematics</option>
            <option value="physics">Physics</option>
        </select><br><br>  
        
        <fieldset>
            <legend>Choose your year level:</legend>
            <input type="radio" id="freshman" name="year" value="freshman">
            <label for="freshman">Freshman</label><br>
            <input type="radio" id="sophomore" name="year" value="sophomore">
            <label for="sophomore">Sophomore</label><br>
            <input type="radio" id="junior" name="year" value="junior">
            <label for="junior">Junior</label><br>
            <input type="radio" id="senior" name="year" value="senior">
            <label for="senior">Senior</label><br><br>
        </fieldset>

        <fieldset>
            <legend>How would you like to be contacted?</legend>
            <input type ="radio" id="contact-text" name="contactMethod" value="text">
            <label for="contact-text">Text</label><br>
            <input type="radio" id="contact-email" name="contactMethod" value="email">
            <label for="contact-email">Email</label><br>
            <input type="radio" id="contact-phone" name="contactMethod" value="phone">
            <label for="contact-phone">Phone</label><br><br>
        </fieldset>

        <input type="submit" value="Login">
    </form>
